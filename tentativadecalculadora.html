<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .fundo{
            background-image: linear-gradient(180deg,black,darkblue);
            height: 100vh;
            color:white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .calculadora{
            position: absolute;
            background-image: url(https://aiuka.com.br/noticias/wp-content/uploads/2021/08/mailchimp_paciente_border.jpg);
            background-size: 230%;
            background-position: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            padding: 15px;
            border: 30px;
            border-color: rgb(255, 255, 255);
            border-radius: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        
        }
        .botao{
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            background-color: deepskyblue;
            border-width: 4px;
            border-color: aqua;
            border-radius: 10px;
            color: white;
            opacity: 60%;
            margin: 3px;
        }
        .botao:hover{
            background-color: skyblue;
        }
        #resultado{
            width: 207px;
            height: 30px;
            background-color: white;
            opacity: 70%;
            margin: 5px;
            font-size: 20px;
            color: black;
            text-align: right;
            padding: 5px;
        }
        .rodape{
            background-color: blue;
            position: fixed;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: large;
            top: 95%;
        }
        .data{
            background-color: black;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: large;
            font-style: italic;

        }
    </style>
</head>
<body>
    <div class="fundo">
        
        <div class="rodape">
           
            <footer>
            <p> Calculadora feita por Sabrina Barbosa </p>
            </footer>
         
        </div>  
        
        <div class="data">
            <nav>
                <p> criada em 15/09/2024 </p>
            </nav>
        </div>

        <div class="calculadora">
            <h1>Calculadora</h1>
     
       
         <p id="resultado"></p>
        
         <table>
            <tr>
             <td><button class="botao" onclick="clean()">C</button></td>
             <td><button class="botao" onclick="back()"><</button></td>
             <td><button class="botao" onclick="insert('/')">/</button></td>
             <td><button class="botao" onclick="insert('*')">*</button></td>
             </tr>
            <tr>
                <td><button class="botao" onclick="insert('7')">7</button></td>
                <td><button class="botao" onclick="insert('8')">8</button></td>
                <td><button class="botao" onclick="insert('9')">9</button></td>
                <td><button class="botao" onclick="insert('-')">-</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="insert('4')">4</button></td>
                <td><button class="botao" onclick="insert('5')">5</button></td>
                <td><button class="botao" onclick="insert('6')">6</button></td>
                <td><button class="botao" onclick="insert('+')">+</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="insert('1')">1</button></td>
                <td><button class="botao" onclick="insert('2')">2</button></td>
                <td><button class="botao" onclick="insert('3')">3</button></td>
                <td rowspan="2"><button class="botao" style="height: 106px;" onclick="calcular()">=</button></td>
            </tr>
            <tr>
                <td colspan="2"><button class="botao" style="width: 106px;" onclick="insert('0')">0</button></td>
                <td><button class="botao" onclick="insert('.')">.</button></td>
            </tr>
            </table>
       </div>
    </div>
    <script>
         function insert(num)
         {
           var numero = document.getElementById ('resultado').innerHTML;
           document.getElementById ('resultado').innerHTML = numero + num;
         }
         function clean()
         {
           document.getElementById ('resultado').innerHTML = "";
         }
         function back()
         {
            var resultado = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = resultado.substring(0, resultado.length -1) ;
         }
         function calcular()
         {
            var resultado = document.getElementById('resultado').innerHTML;
            if (resultado){            
                document.getElementById('resultado').innerHTML = eval(resultado);
              }
            else {
                document.getElementById('resultado').innerHTML = "Sem cálculos"
            }
         }
    </script>
</body>
</html>
